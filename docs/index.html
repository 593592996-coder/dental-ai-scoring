<style>

const DATA=[{"name": "第1套", "cases": [{"no": "病例一", "subj": "牙体牙髓病学", "cat": "牙体牙髓", "diag": "26 急性牙髓炎（化脓期）", "level": "中", "time": "6分钟", "stem": [{"k": "患者", "v": "男，32岁，职员。"}, {"k": "主诉", "v": "左上后牙自发性疼痛3天，加重伴夜间痛1天。"}, {"k": "现病史", "v": "3天前左上后牙无明显诱因出现自发性、阵发性疼痛，遇冷热刺激疼痛明显加重，疼痛放射至同侧颞部、耳部，不能明确指出具体患牙。1天来发作频繁、持续时间延长，夜间痛明显、平卧时加重，自服止痛药效果不佳；就诊前疼痛剧烈，口含冷水可暂时缓解。无面部肿胀、发热及张口受限，否认咬合痛明显加重。26数月前外院充填，术后偶有冷热敏感，未行根管治疗。"}, {"k": "既往史", "v": "体健，否认系统病史及药物过敏史。"}, {"k": "口腔检查", "v": "26远中邻合面旧充填体，边缘见继发龋，探及软化牙本质并达髓腔，探痛（++）。26叩诊（±），不松动，颊侧牙龈无红肿窦道、未及波动感，咬诊无特异痛。冷热测：冷测反应剧烈、热测引发剧痛，刺激去除后疼痛持续数十秒；热测剧痛、冷水含漱可缓解。电活力测验26有反应、较对照牙敏感。25、27牙体及活力未见异常，龈乳头形态基本正常。"}, {"k": "X线", "v": "26远中邻面低密度影近髓/及髓；根尖周膜腔基本正常，根尖区未见骨质破坏暗影，牙槽骨无明显吸收。"}], "qs": [{"tag": "病史采集·多选", "stem": "为明确诊断，接诊时采集疼痛病史应重点询问哪些特征？", "opts": ["疼痛的发作方式（自发性/激发性、阵发性/持续性）", "疼痛能否自行定位、有无放散及放散范围", "疼痛与冷热刺激的关系，及刺激去除后是否持续", "有无夜间痛、平卧时加重", "咬紧牙后疼痛是否反而缓解", "患者的职业与经济收入"], "ans": "ABCD", "exp": "ABCD为急性牙髓炎“疼痛四性+夜间痛+不能定位”核心病史；E“咬紧缓解”是急性根尖周炎浆液期特征（鉴别干扰）；F与诊断无关。"}, {"tag": "牙髓检查·多选", "stem": "关于本例温度测验与电活力测验的判读，正确的是：", "opts": ["急性牙髓炎热测可引发剧痛，刺激去除后疼痛仍持续", "电活力测验只记录“有反应/无反应”，不解读具体阈值数字", "牙髓化脓时可出现热测剧痛、冷测缓解（热痛冷缓解）", "温度测验应先测对照牙，再测可疑牙", "冷热测无反应即可单独诊断急性牙髓炎", "急性牙髓炎患牙电活力测验一定无反应"], "ans": "ABCD", "exp": "E无反应提示牙髓坏死/根尖周炎，不支持急性牙髓炎；F急性牙髓炎牙髓仍有活力，电活力多为有反应、敏感（阈值降低）。"}, {"tag": "诊断·单选", "stem": "综合病史与检查，最可能的诊断是：", "opts": ["26急性根尖周炎", "26急性牙髓炎（化脓期）", "26慢性牙髓炎", "急性上颌窦炎", "三叉神经痛", "26牙本质过敏症"], "ans": "B", "exp": "自发阵发+夜间痛+不能定位+温度持续痛+热痛冷缓解+活力敏感、根尖无暗影，符合急性牙髓炎化脓期。根尖周炎应能定位、叩痛、活力多丧失；上颌窦炎多牙+鼻塞+弯腰加重；三叉神经痛有扳机点秒痛；牙本质过敏无自发夜间痛。"}, {"tag": "鉴别诊断·多选", "stem": "本例（考试轨）需要与下列哪些疾病鉴别？", "opts": ["三叉神经痛", "急性上颌窦炎", "急性龈乳头炎", "急性根尖周炎", "复发性阿弗他溃疡", "慢性牙周炎"], "ans": "ABC", "exp": "执业医师技能考试“急性牙髓炎三鉴别”=龈乳头炎+三叉神经痛+急性上颌窦炎（26为上颌后牙，上颌窦炎必须鉴别）。急性根尖周炎临床需鉴别，但教科书多视为同一疾病进程，机考按考试三鉴别；阿弗他溃疡、牙周炎与本急症无关。"}, {"tag": "鉴别依据·多选", "stem": "下列关于三叉神经痛的描述，可用于与本例鉴别的是：", "opts": ["存在扳机点，轻触特定部位即诱发", "疼痛为电击样、刀割样，历时短暂（数秒）", "发作与冷热刺激无关，夜间多不发作", "患牙牙体及活力多正常，误拔牙后疼痛仍不消失", "治疗首选对患牙行根管治疗", "一次发作常持续数小时不缓解"], "ans": "ABCD", "exp": "E错：三叉   <div class="card">
    <button class="bigbtn b1" onclick="chooseSet('study')">📖 背题模式<span class="d">每题选完立即看对错与解析，按套练习</span></button>
    <button class="bigbtn b2" onclick="chooseSet('exam')">⏱ 模拟考模式<span class="d">整套30分钟限时，交卷后出分+逐题解析</span></button>
    <button class="bigbtn b3" onclick="viewWrong()">⭐ 错题本<span class="d">${w.length?`当前收藏 ${w.length} 题`:"做过的错题自动收在这里"}</span></button>
    <button class="bigbtn b4" onclick="viewAbout()">ℹ️ 答题策略与说明</button>
  </div>
  <div class="muted" style="text-align:center">进度自动保存在本机；建议用Safari“添加到主屏幕”</div>`;
}
let pendingMode=null;
function chooseSet(mode){pendingMode=mode;renderSetChips();}
function renderSetChips(){
 $app.innerHTML=header(pendingMode==="study"?"背题模式 · 选套卷":"模拟考 · 选套卷")+`
 <div class="card">
   <div class="sets">${DATA.map((_,i)=>`<div class="setchip" id="sc${i}" onclick="pickSet(${i})">第${i+1}套</div>`).join("")}</div>
   <div class="muted" style="margin-top:8px">每套5个病例（牙体牙髓/牙周/黏膜/口外·儿牙/修复各1例）。模拟考交卷前可上下翻改。</div>
 </div>`;
}
function pickSet(i){if(pendingMode==="study")startStudy(i,true);else startExam(i);}

/* ---------------- 背题模式 ---------------- */
let study=null;
function startStudy(si,resume){
 const items=flatten(si);
 let idx=0;
 if(resume){const p=store.get(LS_P,{});if(p.mode==="study"&&p.si===si)idx=Math.min(p.idx||0,items.length-1);}
 study={si,items,idx,picked:[],revealed:store.get("jz_dummy",{})};
 renderStudy();
}
function toggleOpt(L){
 const it=study.items[study.idx];
 const cur=study.picked[study.idx]||[];
 const i=cur.indexOf(L);
 if(i>=0)cur.splice(i,1);else cur.push(L);
 study.picked[study.idx]=cur;
 renderStudy();
}
function reveal(){
 study.items[study.idx].revealed=true;
 const it=study.items[study.idx],picked=study.picked[study.idx]||[];
 const r=scoreQ(it.q,picked);
 // 错题本：非满分即收录；满分则移出
 let w=store.get(LS_W,[]);
 const id=keyOf(it);
 if(r.gain<r.max){if(!w.includes(id))w.push(id);}else{w=w.filter(x=>x!==id);}
 store.set(LS_W,w);
 renderStudy();
}
function nextQ(){if(study.idx<study.items.length-1){study.idx++;store.set(LS_P,{mode:"study",si:study.si,idx:study.idx});renderStudy();}else viewStudyDone();}
function renderStudy(){
 const it=study.items[study.idx],q=it.q,picked=study.picked[study.idx]||[],rev=!!it.revealed;
 const A=q.ans.split("");
 const firstInCase=study.idx===0||study.items[study.idx-1].ci!==it.ci;
 const opts=q.opts.map((o,i)=>{const L=LETTERS[i];let cls="opt";
   if(rev){if(A.includes(L))cls+=" correct";else if(picked.includes(L))cls+=" wrong";else cls+=" dim";}
   else if(picked.includes(L))cls+=" sel";
   const click=rev?"":`onclick="toggleOpt('${L}')"`;
   return `<div class="${cls}" ${click}><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("");
 let verdict="";
 if(rev){const r=scoreQ(q,picked);
   const cls=r.gain===r.max?"v-ok":(r.gain>0?"v-part":"v-bad");
   verdict=`<div class="verdict ${cls}">本题得分 ${r.gain}/${r.max}　正确答案：${q.ans}</div>
            <div class="exp"><b>解析：</b>${q.exp}</div>`;
 }
 const isLast=study.idx===study.items.length-1;
 $app.innerHTML=header(`背题 · 第${study.si+1}套 (${study.idx+1}/${study.items.length})`,"","home")
  +caseBlock(it.c,firstInCase)
  +`<div class="card">
      <span class="qtag">${q.tag}</span>
      <p class="qstem">${q.stem}</p>
      ${opts}${verdict}
      <div class="footspace"></div>
      ${rev?`<button class="btn ${isLast?"btn-ok":"btn-pri"}" onclick="nextQ()">${isLast?"完成本套，看小结":"下一题 ›"}</button>`
            :`<button class="btn btn-pri" ${picked.length?"":"disabled"} onclick="reveal()">确认答案</button>`}
    </div>`;
 window.scrollTo(0,0);
}
function viewStudyDone(){
 const items=study.items;let gain=0,max=0,perfect=0;
 items.forEach((it,i)=>{const p=study.picked[i]||[];const r=scoreQ(it.q,p);gain+=r.gain;max+=r.max;if(r.gain===r.max)perfect++;});
 $app.innerHTML=header("本套背题完成")
 +`<div class="card scorehero"><div class="num">${Math.round(gain/max*100)}</div><div class="lb">掌握度（满分100）</div>
   <div class="statgrid"><div class="stat"><div class="n">${perfect}/${items.length}</div><div class="t">一次答对</div></div>
   <div class="stat"><div class="n">${items.length-perfect}</div><div class="t">需复习</div></div>
   <div class="stat"><div class="n">${store.get(LS_W,[]).length}</div><div class="t">错题本</div></div></div></div>
   <button class="btn btn-pri" onclick="viewHome()">返回首页</button>
   <div style="height:10px"></div><button class="btn btn-ghost" onclick="startStudy(${study.si},false)">重新刷本套</button>`;
}

/* ---------------- 模拟考 ---------------- */
let exam=null,timerH=null;
function startExam(si){
 const items=flatten(si);
 exam={si,items,picks:{},start:Date.now(),left:30*60,submitted:false};
 clearInterval(timerH);timerH=setInterval(tick,1000);renderExam();
}
function tick(){if(!exam||exam.submitted)return;exam.left--;const el=document.getElementById("tm");if(el)el.textContent=fmt(exam.left);if(exam.left<=0){clearInterval(timerH);submitExam(true);}}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function toggleExam(k,L){const cur=exam.picks[k]||[];const i=cur.indexOf(L);if(i>=0)cur.splice(i,1);else cur.push(L);exam.picks[k]=cur;renderExam(true);}
function renderExam(keepScroll){
 const y=window.scrollY;
 let lastCi=-1,html=header(`模拟考 · 第${exam.si+1}套`,`<span class="timer" id="tm">${fmt(exam.left)}</span>`,"examQuit");
 exam.items.forEach((it,i)=>{const k=i;
   if(it.ci!==lastCi){html+=caseBlock(it.c,true);lastCi=it.ci;}
   const picked=exam.picks[k]||[];
   html+=`<div class="card"><span class="qtag">${it.q.tag}</span><p class="qstem">${i+1}. ${it.q.stem}</p>`+
    it.q.opts.map((o,j)=>{const L=LETTERS[j];return `<div class="opt ${picked.includes(L)?"sel":""}" onclick="toggleExam(${k},'${L}')"><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("")+
    `</div>`;
 });
 const answered=Object.keys(exam.picks).filter(k=>(exam.picks[k]||[]).length).length;
 html+=`<div style="position:sticky;bottom:0;background:linear-gradient(transparent,#eef3f5 30%);padding:10px 0 calc(10px + env(safe-area-inset-bottom))">
   <button class="btn btn-ok" onclick="askSubmit()">交卷（已答 ${answered}/${exam.items.length}）</button></div>`;
 $app.innerHTML=html;if(keepScroll)window.scrollTo(0,y);
}
function askSubmit(){const unanswered=exam.items.filter((_,i)=>!(exam.picks[i]||[]).length).length;
 if(unanswered>0){if(!confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`))return;}
 submitExam(false);}
function quitExam(){if(confirm("退出本次模拟考？作答不会保留。")){clearInterval(timerH);exam=null;viewHome();}}
function submitExam(auto){
 clearInterval(timerH);exam.submitted=true;
 const used=30*60-exam.left;
 let gain=0,max=0,wrong=0;const perCase={};
 const w=store.get(LS_W,[]);let wset=new Set(w);
 exam.items.forEach((it,i)=>{const p=exam.picks[i]||[];const r=scoreQ(it.q,p);gain+=r.gain;max+=r.max;
   perCase[it.ci]=(perCase[it.ci]||{g:0,m:0,name:it.c.no,cat:it.c.cat});perCase[it.ci].g+=r.gain;perCase[it.ci].m+=r.max;
   if(r.gain<r.max){wrong++;wset.add(keyOf(it));}else{wset.delete(keyOf(it));}});
 store.set(LS_W,[...wset]);
 const score=Math.round(gain/max*100);
 let html=header(`模拟考结果 · 第${exam.si+1}套`)
 +`<div class="card scorehero"><div class="num">${score}</div><div class="lb">总分（百分制）　用时 ${fmt(used)}${auto?"（时间到自动交卷）":""}</div>
   <div class="statgrid"><div class="stat"><div class="n">${gain}/${max}</div><div class="t">选项得分</div></div>
   <div class="stat"><div class="n">${exam.items.length-wrong}</div><div class="t">完全正确</div></div>
   <div class="stat"><div class="n">${wrong}</div><div class="t">有错/漏选</div></div></div></div>`;
 html+=`<div class="card"><div class="qstem" style="font-size:15px">分病例得分</div>`+
  Object.values(perCase).map(p=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${p.name} · ${p.cat}</span><b>${p.g}/${p.m}</b></div><div class="bar"><i style="width:${Math.round(p.g/p.m*100)}%"></i></div></div>`).join("")+`</div>`;
 // 逐题回顾
 let lastCi=-1;
 html+=`<div class="card"><div class="qstem" style="font-size:15px">逐题解析</div>`;
 exam.items.forEach((it,i)=>{const q=it.q,p=exam.picks[i]||[],r=scoreQ(q,p),A=q.ans.split("");
   if(it.ci!==lastCi){html+=`<div style="margin-top:10px;font-weight:700;color:var(--blue)">${it.c.no}（${it.c.subj}）</div>`;lastCi=it.ci;}
   html+=`<div class="qblock"><div class="review-head"><span class="pill cat">${q.tag}</span>
     <span class="pill ${r.gain===r.max?"right":"miss"}">${r.gain===r.max?"正确":r.gain+"/"+r.max}</span></div>
     <div style="font-weight:600;font-size:14.5px;margin-bottom:6px">${i+1}. ${q.stem}</div>`+
     q.opts.map((o,j)=>{const L=LETTERS[j];let cls="opt dim";if(A.includes(L))cls="opt correct";else if(p.includes(L))cls="opt wrong";
       return `<div class="${cls}"><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("")+
     `<div class="exp"><b>答案 ${q.ans}｜</b>${q.exp}</div></div>`;
 });
 html+=`</div><button class="btn btn-pri" onclick="viewHome()">返回首页</button>
        <div style="height:10px"></div><button class="btn btn-ghost" onclick="startExam(${exam.si})">再考一次本套</button>`;
 $app.innerHTML=html;window.scrollTo(0,0);
}

/* ---------------- 错题本 ---------------- */
function findByKey(k){const [si,ci,qi]=k.split("-").map(Number);const it=flatten(si).find(x=>x.ci===ci&&x.qi===qi);return it;}
let wrongMode={i:0,rev:{}};
function viewWrong(){
 const keys=store.get(LS_W,[]);const items=keys.map(findByKey).filter(Boolean);
 if(!items.length){$app.innerHTML=header("错题本")+`<div class="card empty">还没有错题 🎉<br>背题或模拟考中没拿满分的题会自动收进来</div><button class="btn btn-pri" onclick="viewHome()">返回首页</button>`;return;}
 wrongMode={items,i:0,rev:{},picked:{}};renderWrong();
}
function wToggle(L){const cur=wrongMode.picked[wrongMode.i]||[];const x=cur.indexOf(L);if(x>=0)cur.splice(x,1);else cur.push(L);wrongMode.picked[wrongMode.i]=cur;renderWrong();}
function wReveal(){wrongMode.rev[wrongMode.i]=true;renderWrong();}
function wNext(){
 // 当前题若已做对，则从错题本移除（下一题顶到同一索引）；否则前进
 const it=wrongMode.items[wrongMode.i];
 const picked=wrongMode.picked[wrongMode.i]||[];
 const full=it&&scoreQ(it.q,picked).gain===scoreQ(it.q,picked).max;
 if(full){const ws=store.get(LS_W,[]).filter(x=>x!==keyOf(it));store.set(LS_W,ws);wrongMode.items.splice(wrongMode.i,1);wrongMode.rev={};}
 else{wrongMode.i++;}
 if(wrongMode.i>=wrongMode.items.length){if(wrongMode.items.length===0)viewHome();else{wrongMode.i=wrongMode.items.length-1;viewHome();}return;}
 renderWrong();window.scrollTo(0,0);
}
function renderWrong(){
 const it=wrongMode.items[wrongMode.i],q=it.q,picked=wrongMode.picked[wrongMode.i]||[],rev=wrongMode.rev[wrongMode.i],A=q.ans.split("");
 const opts=q.opts.map((o,j)=>{const L=LETTERS[j];let cls="opt";if(rev){if(A.includes(L))cls+=" correct";else if(picked.includes(L))cls+=" wrong";else cls+=" dim";}else if(picked.includes(L))cls+=" sel";
  return `<div class="${cls}" ${rev?"":`onclick="wToggle('${L}')"`}><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("");
 let verdict="";if(rev){const r=scoreQ(q,picked);
  verdict=`<div class="verdict ${r.gain===r.max?"v-ok":(r.gain?"v-part":"v-bad")}">得分 ${r.gain}/${r.max}　答案 ${q.ans}</div><div class="exp"><b>解析：</b>${q.exp}</div>`;
 }
 $app.innerHTML=header(`错题本 (${wrongMode.i+1}/${wrongMode.items.length})`,"","home")
 +`<div class="card wrong-item"><div class="muted" style="margin-bottom:6px">第${it.si+1}套 · ${it.c.subj}</div>`
 +caseBlock(it.c,false)
 +`<span class="qtag">${q.tag}</span><p class="qstem">${q.stem}</p>${opts}${verdict}<div class="footspace"></div>`
 +(rev?`<button class="btn btn-pri" onclick="wNext()">${wrongMode.i<wrongMode.items.length-1?"下一题 ›":"做完，返回"}</button>`
      :`<button class="btn btn-pri" ${picked.length?"":"disabled"} onclick="wReveal()">确认答案</button>`)
 +`</div>`;
 window.scrollTo(0,0);
}

/* ---------------- 说明 ---------------- */
function viewAbout(){
 $app.innerHTML=header("答题策略与说明")+
 `<div class="card"><div class="qstem">计分规则</div>
  <div class="muted" style="color:#33484e;font-size:14px;line-height:1.7">
  每个选项独立计分：<b style="color:var(--ok)">选对 +1</b>、<b style="color:var(--bad)">错选 −1</b>，正确项没选不得分也不扣分；每题最低0分。<br>
  系统不提示单选/多选。问“诊断/首选”多为单选（1个正确项）；问“依据/检查/治疗/正确的是”多为多选。</div></div>
 <div class="card"><div class="qstem">四条拿分策略</div>
 <div style="font-size:14.5px;line-height:1.9">
 1. <b>宁缺毋滥</b>：错选倒扣，只勾有把握的，不赌拿不准的选项。<br>
 2. <b>抓绝对化错误项</b>：如“牙髓炎常规全身抗生素”“不可复牙髓炎做盖髓保髓”，基本是干扰项。<br>
 3. <b>抓题眼</b>：自发阵发/夜间/不能定位→急性牙髓炎；扳机点秒痛→三叉神经痛；上感+多颗上颌后牙+弯腰加重→上颌窦炎；食物嵌塞+龈乳头红肿→龈乳头炎。<br>
 4. 30分钟5病例，平均每病例6分钟，不在某一问纠缠。</div></div>
 <div class="note">题目为自建模拟题，按口腔执业医师考试难度与范围命制；最终计分细则（错选是否0分封顶）以赛项官方答疑为准。</div>
 <button class="btn btn-pri" onclick="viewHome()">我知道了</button>`;
}
function go(v){clearInterval(timerH);if(v==="examQuit"){quitExam();return;}exam=null;viewHome();}
viewHome();
</script>
</body>
</html>
