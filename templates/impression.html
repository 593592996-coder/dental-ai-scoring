<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>藻酸盐印模制取 AI评分</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#f0f4f8;min-height:100vh}
.header{background:linear-gradient(135deg,#0F766E,#14B8A6);color:#fff;padding:20px 0;text-align:center}
.header h1{font-size:24px;font-weight:700}.header p{font-size:13px;opacity:.9;margin-top:5px}
.container{max-width:860px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card h2{font-size:18px;color:#0F766E;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #14B8A6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;color:#2C3E50;margin-bottom:6px;font-weight:600}
.form-group input{width:100%;padding:10px 12px;border:1.5px solid #dde;border-radius:8px;font-size:14px}
.jaw-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slot{border:2px dashed #7fc8be;border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;background:#f4fbfa;position:relative;transition:.2s;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot:hover{background:#e6f7f5;border-color:#14B8A6}
.slot.filled{border-style:solid;border-color:#27ae60;background:#f3fbf6}
.slot .bigicon{font-size:40px;margin-bottom:8px}
.slot .lab{font-size:15px;font-weight:700;color:#0F766E}
.slot .sub{font-size:11.5px;color:#888;margin-top:5px;line-height:1.5}
.slot img{width:100%;max-height:210px;object-fit:contain;border-radius:8px;margin-top:8px}
.slot .x{position:absolute;top:8px;right:10px;color:#c0392b;font-size:20px;display:none;font-weight:700;background:#fff;border-radius:50%;width:24px;height:24px;line-height:22px}
.slot.filled .x{display:block}
.slot input{display:none}
.btn{padding:12px 32px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#0F766E,#14B8A6);color:#fff;width:100%}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.notice{margin:12px 0 16px;padding:12px 14px;background:#fff8e1;border:1.5px solid #f39c12;border-radius:10px;font-size:12.5px;line-height:1.9;color:#7a5b00}
.notice b{color:#b9770e}
.keyline{display:inline-block;background:#eaf3ff;border:1px solid #b9d4f5;border-radius:6px;padding:1px 7px;margin:2px;font-size:11.5px;color:#1B5aa8}
.result-area{display:none;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.score-circle{width:128px;height:128px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 12px}
.score-circle.excellent{background:linear-gradient(135deg,#27ae60,#2ecc71)}.score-circle.good{background:linear-gradient(135deg,#2B7BEC,#3498db)}.score-circle.mid{background:linear-gradient(135deg,#f39c12,#e67e22)}
.score-circle.pass{background:linear-gradient(135deg,#e67e22,#d35400)}.score-circle.fail{background:linear-gradient(135deg,#c0392b,#e74c3c)}
.score-circle .big{font-size:36px;font-weight:700;color:#fff}.score-circle .small{font-size:12px;color:rgba(255,255,255,.9)}
.jawscores{display:flex;gap:14px;justify-content:center;margin:10px 0}
.jawchip{background:#f0f7ff;border:1px solid #cfe3fb;border-radius:10px;padding:10px 22px;text-align:center;min-width:130px}
.jawchip.miss{background:#f7f7f7;border-color:#e0e0e0;color:#999}
.jawchip .t{font-size:12px;color:#666}.jawchip .v{font-size:24px;font-weight:700;color:#1B5aa8;margin-top:2px}.jawchip.miss .v{color:#aaa;font-size:15px}
.dim-bar{display:flex;align-items:center;margin:4px 0}.dim-bar .label{flex:1.3;font-size:12.5px;color:#2C3E50;text-align:right;padding-right:8px}
.dim-bar .bar-wrap{flex:2;height:20px;background:#eee;border-radius:10px;overflow:hidden}
.dim-bar .bar-fill{height:100%;border-radius:10px}
.bar-fill.good{background:linear-gradient(90deg,#27ae60,#2ecc71)}.bar-fill.warning{background:linear-gradient(90deg,#f39c12,#e67e22)}.bar-fill.bad{background:linear-gradient(90deg,#c0392b,#e74c3c)}
.dim-bar .dim-score{width:56px;font-size:12px;color:#666;padding-left:8px}
.process-box{margin:0 0 8px 24px}.process-box pre{white-space:pre-wrap;font-size:11px;color:#555;background:#f9fafb;padding:9px;border-radius:6px;line-height:1.5;margin:0}
.suggestion-box{background:#fff8e1;border-left:4px solid #f39c12;padding:12px 16px;border-radius:8px;margin-top:12px}
.suggestion-box li{font-size:13px;color:#666;margin:5px 0 5px 18px}
.water-banner{background:#e8f8ff;border:1.5px solid #3498db;color:#1b5e8a;border-radius:10px;padding:10px 14px;font-size:13px;margin:8px 0 4px}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center}
.loading-overlay.show{display:flex}.loading-box{background:#fff;border-radius:16px;padding:36px;text-align:center}
.spinner{width:48px;height:48px;border:4px solid #eee;border-top:4px solid #14B8A6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.back-link{display:block;text-align:center;margin:6px 0 16px;color:#0F766E;text-decoration:none;font-size:14px}
@media(max-width:680px){.jaw-grid,.row2{grid-template-columns:1fr}}
</style></head>
<body>
<div class="header"><h1>🦷 藻酸盐印模制取 AI评分</h1><p>上颌 + 下颌组织面照片 → 8 维度量化评分</p></div>
<div class="container">
<a href="/" class="back-link">← 返回首页</a>
<div class="card">
<h2>📸 上传上下颌印模照片</h2>
<div class="row2">
  <div class="form-group"><label>学生姓名</label><input type="text" id="studentName" placeholder="请输入姓名"></div>
  <div class="form-group"><label>班级</label><input type="text" id="studentClass" value="25口腔1班"></div>
</div>

<div class="notice">
<b>📐 拍摄规范（粉色藻酸盐印模料）</b><br>
<span class="keyline">组织面朝上</span><span class="keyline">反差/干净衬底</span><span class="keyline">全弓入镜</span>
<span class="keyline">光线均匀充足</span><span class="keyline">对焦清晰</span><span class="keyline">甩干积水</span><br>
上下颌各拍 1 张；只传一颌也能评（缺的一颌按 60% 保底，建议补齐更准）。
</div>

<div class="jaw-grid" id="jawGrid">
  <div class="slot" id="slot-upper">
    <span class="x">&times;</span>
    <div class="ph"><div class="bigicon">🔺</div><div class="lab">① 上颌印模</div><div class="sub">点按拍照 / 上传<br>腭部居中、牙弓完整入镜</div></div>
    <input type="file" accept="image/*" capture="environment"><img style="display:none">
  </div>
  <div class="slot" id="slot-lower">
    <span class="x">&times;</span>
    <div class="ph"><div class="bigicon">🔻</div><div class="lab">② 下颌印模</div><div class="sub">点按拍照 / 上传<br>舌侧开口朝上、牙弓完整入镜</div></div>
    <input type="file" accept="image/*" capture="environment"><img style="display:none">
  </div>
</div>
<div style="margin-top:16px"><button class="btn btn-primary" id="analyzeBtn" disabled>🔍 开始AI分析（至少上传一张）</button></div>
</div>

<div class="card result-area" id="resultCard"><h2>📊 AI评分结果</h2>
<div style="text-align:center" id="resultContent"></div>
<div style="text-align:center;margin-top:16px">
<button class="btn" style="background:#0F766E;color:#fff;padding:10px 22px;font-size:14px" id="reportBtn">📥 完整报告/导出</button>
<button class="btn" style="background:#27ae60;color:#fff;padding:10px 22px;font-size:14px;margin-left:8px" onclick="location.reload()">🔄 分析下一份</button>
</div></div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="loading-box"><div class="spinner"></div><p style="font-size:16px;color:#0F766E;font-weight:600">AI正在分析印模…</p><p style="font-size:13px;color:#999">完整性 · 气泡 · 边缘伸展 · 变形</p></div></div>

<script>
const files={};
const analyzeBtn=document.getElementById('analyzeBtn');
document.querySelectorAll('.slot').forEach(el=>{
 const jaw=el.id.replace('slot-','');
 const inp=el.querySelector('input'),img=el.querySelector('img'),ph=el.querySelector('.ph');
 el.addEventListener('click',e=>{if(e.target.classList.contains('x'))return;inp.click();});
 inp.addEventListener('change',()=>{const f=inp.files[0];if(!f)return;files[jaw]=f;
   const rd=new FileReader();rd.onload=ev=>{img.src=ev.target.result;img.style.display='block';ph.style.display='none';el.classList.add('filled');refreshBtn();};rd.readAsDataURL(f);});
 el.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();delete files[jaw];inp.value='';img.style.display='none';ph.style.display='flex';el.classList.remove('filled');refreshBtn();});
});
function refreshBtn(){analyzeBtn.disabled=Object.keys(files).length===0;}
analyzeBtn.addEventListener('click',async()=>{
 const ov=document.getElementById('loadingOverlay');ov.classList.add('show');
 const fd=new FormData();
 if(files.upper)fd.append('upper',files.upper);
 if(files.lower)fd.append('lower',files.lower);
 fd.append('student_name',document.getElementById('studentName').value||'匿名');
 fd.append('student_class',document.getElementById('studentClass').value||'未知班级');
 try{
  const resp=await fetch('/analyze_impression',{method:'POST',body:fd});
  const txt=await resp.text();let data;
  try{data=JSON.parse(txt)}catch(_){alert('服务器返回异常（HTTP '+resp.status+'），请重试。');return;}
  if(data.error){alert(data.error);return;}
  renderResult(data);
 }catch(err){alert('分析失败：网络或服务器异常，请重试。（'+err.message+'）');}
 finally{ov.classList.remove('show');document.getElementById('resultCard').style.display='block';document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});}
});
function renderResult(data){
 const gc={'优秀':'excellent','良好':'good','中等':'mid','及格':'pass','不及格':'fail'}[data.grade]||'pass';
 const chip=(present,label,score)=>present
   ?`<div class="jawchip"><div class="t">${label}</div><div class="v">${score}</div></div>`
   :`<div class="jawchip miss"><div class="t">${label}</div><div class="v">未上传</div></div>`;
 let dims=data.dimensions.map((d,i)=>{
  let bc=d.status==='good'?'good':(d.status==='warning'?'warning':'bad');
  let icon=d.status==='good'?'✅':(d.status==='warning'?'⚠️':'❌');
  let proc=d.process_analysis?('<div class="process-box"><div style="cursor:pointer;font-size:12px;color:#0F766E;margin-bottom:4px" onclick="var e=document.getElementById(\'pb'+i+'\');e.style.display=e.style.display===\'none\'?\'block\':\'none\'">📋 打分过程（点击展开/收起）</div><div id="pb'+i+'" style="display:none"><pre>'+d.process_analysis+'</pre>'+(d.targeted_suggestion?'<div style="background:#fff8e1;padding:9px;border-radius:6px;margin-top:6px;font-size:12px;border-left:3px solid #f39c12">💡 '+d.targeted_suggestion+'</div>':'')+'</div></div>'):'';
  return '<div class="dim-bar"><div class="label">'+icon+' '+d.name+'</div><div class="bar-wrap"><div class="bar-fill '+bc+'" style="width:'+d.percentage+'%"></div></div><div class="dim-score">'+d.score+'/'+d.max_score+'</div></div>'+proc;
 }).join('');
 let water=data.water_warning?'<div class="water-banner">💧 检出积水反光，灌模前务必将印模吹干。</div>':'';
 let cap=data.cap?`<div class="water-banner" style="background:#fff4e5;border-color:#e67e22;color:#9c5a10">⚠️ 综合分已封顶 ${data.total_score} 分（存在关键区缺料或严重变形）。</div>`:'';
 let sug=(data.suggestions&&data.suggestions.length)?'<div class="suggestion-box"><h4 style="color:#e67e22;font-size:14px;margin-bottom:6px">🔧 优先改进</h4><ol>'+data.suggestions.map(s=>'<li>'+s+'</li>').join('')+'</ol></div>':'';
 document.getElementById('reportBtn').onclick=()=>window.open('/report/'+data.session_id,'_blank');
 document.getElementById('resultContent').innerHTML=
  '<div class="score-circle '+gc+'"><span class="big">'+data.total_score+'</span><span class="small">/100 · '+data.grade+'</span></div>'+
  '<div class="jawscores">'+chip(data.upper_present,'上颌',data.upper_score)+chip(data.lower_present,'下颌',data.lower_score)+'</div>'+
  water+cap+
  '<div style="background:#f0faf8;padding:11px;border-radius:8px;margin:10px 0;text-align:left;font-size:13px;line-height:1.6"><strong>📝 </strong>'+data.overall_assessment+'</div>'+
  '<div style="text-align:left">'+dims+'</div>'+sug+
  '<div style="font-size:11px;color:#0f766e;background:#e6f7f5;border-radius:6px;padding:8px 10px;margin-top:12px;line-height:1.6">⚠️ '+(data.disclaimer||'')+'</div>'+
  '<p style="margin-top:10px;font-size:12px;color:#999">'+data.timestamp+'</p>';
}
</script>
<script src="/static/identity.js?v=20260915"></script>
</body></html>
