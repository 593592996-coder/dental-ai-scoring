<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>教师后台登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(160deg,#16324f,#1f5f8b);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:32px 30px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{font-size:19px;color:#16324f;text-align:center;margin-bottom:4px}
p.sub{font-size:12px;color:#99a3ad;text-align:center;margin-bottom:22px}
label{font-size:13px;font-weight:700;color:#16324f;display:block;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1.8px solid #cfd8e3;border-radius:9px;font-size:15px}
input:focus{outline:none;border-color:#1f5f8b}
button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#1f5f8b,#16324f);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.err{color:#c0392b;font-size:13px;margin-top:12px;text-align:center;min-height:16px}
a.back{display:block;text-align:center;margin-top:16px;font-size:12px;color:#888;text-decoration:none}
</style></head>
<body>
<div class="card">
  <h1>📊 教师后台</h1>
  <p class="sub">请输入后台密码（学生无需进入）</p>
  <form method="post" action="/admin/login">
    <label>密码</label>
    <input type="password" name="password" autofocus autocomplete="off">
    <div class="err">{{ error }}</div>
    <button type="submit">进入后台</button>
  </form>
  <a class="back" href="/">← 返回训练首页</a>
</div>
</body>
</html>
