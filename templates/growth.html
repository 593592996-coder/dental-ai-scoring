<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的成长曲线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#f0f4f8;min-height:100vh}
.header{background:linear-gradient(135deg,#1B3A5C,#2B7BEC);color:#fff;padding:20px 0;text-align:center}
.header h1{font-size:22px}.header p{font-size:12.5px;opacity:.85;margin-top:4px}
.wrap{max-width:760px;margin:22px auto;padding:0 16px}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mtab{border:none;background:#dce5ef;color:#55667a;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.mtab.on{background:linear-gradient(135deg,#2B7BEC,#1B3A5C);color:#fff}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px}
#chartCard{padding:22px 18px 14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.chip{background:#f0f4f8;border-radius:10px;padding:9px 14px;font-size:13px;color:#2C3E50;text-align:center;min-width:96px}
.chip b{display:block;font-size:18px;color:#1B3A5C;margin-top:2px}
.chip.gain b{color:#27ae60}.chip.gain.down b{color:#c0392b}
.empty{text-align:center;color:#889;font-size:14px;padding:40px 10px;line-height:1.9}
.btn{border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(135deg,#27ae60,#1e8449)}
.btn:disabled{background:#bbb;cursor:not-allowed}
.btn.b{background:linear-gradient(135deg,#2B7BEC,#1B3A5C)}
.rowbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.foot{text-align:center;margin-top:6px}
.foot a{color:#2B7BEC;text-decoration:none;font-size:13px}
</style></head>
<body>
<div class="header"><h1>📈 我的成长曲线</h1><p>每练一次记录一点，看见自己的进步</p></div>
<div class="wrap">
<div class="mtabs" id="mtabs"></div>

<div class="card" id="chartCard">
<div id="captureArea" style="background:#fff;padding:6px 4px">
<div id="who" style="font-size:13px;color:#5a6b7b;margin-bottom:6px"></div>
<div id="chart"></div>
<div id="caption" style="text-align:center;font-size:12px;color:#999;margin-top:4px"></div>
</div>
<div class="stats" id="stats"></div>
</div>

<div class="rowbtns">
<button class="btn" id="saveBtn" disabled>📥 保存图片</button>
<a href="/"><button class="btn b" type="button">🏠 返回首页</button></a>
</div>
</div>

<script src="/static/identity.js?v=20260915"></script>
<script src="/static/vendor/html2canvas.min.js"></script>
<script>
let DATA=null, cur=0;

function el(id){return document.getElementById(id);}

async function load(){
  const d=await (await fetch('/api/my_progress')).json();
  if(d.error){return;}
  DATA=d;
  const tabs=el('mtabs');
  if(!d.modules.length){
    tabs.innerHTML='';
    el('chart').innerHTML='<div class="empty">还没有练习记录。<br>去完成第一次练习，曲线就会出现啦！</div>';
    el('stats').innerHTML='';el('caption').textContent='';el('who').textContent='';
    el('saveBtn').disabled=true;
    return;
  }
  tabs.innerHTML=d.modules.map((m,i)=>
    `<button class="mtab ${i===0?'on':''}" onclick="pick(${i})">${m.name}</button>`).join('');
  draw();
}

function pick(i){cur=i;
  el('mtabs').querySelectorAll('.mtab').forEach((b,j)=>b.classList.toggle('on',j===i));
  draw();
}

function draw(){
  const m=DATA.modules[cur], s=m.scores;
  el('who').textContent=`${DATA.name} · ${DATA['class']} · ${m.name}`;
  el('caption').textContent=`共练习 ${m.n} 次 · 记录日期 ${DATA.today}`;
  el('chart').innerHTML=lineSVG(s);

  const gain=m.gain;
  el('stats').innerHTML=`
   <div class="chip">第一次<b>${m.first}</b></div>
   <div class="chip">最后一次<b>${m.last}</b></div>
   <div class="chip">最高分<b>${m.best}</b></div>
   <div class="chip gain ${gain<0?'down':''}">${gain>=0?'提升':'下降'}<b>${Math.abs(gain)}</b></div>`;
  el('saveBtn').disabled=false;
}

// ── 纯SVG折线图 ──
function lineSVG(scores){
  const W=680,H=340,L=48,R=24,T=28,B=46;
  const iw=W-L-R, ih=H-T-B;
  const n=scores.length;
  const x=i=> L + (n===1?iw/2: i*iw/(n-1));
  const y=v=> T + ih - (v/100)*ih;

  let g='';
  // 水平网格 + Y轴刻度
  for(let v=0;v<=100;v+=20){
    const yy=y(v);
    g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${v===0?'#c3cedb':'#eef2f7'}" stroke-width="1"/>`;
    g+=`<text x="${L-8}" y="${yy+4}" font-size="11" fill="#9aa6b4" text-anchor="end">${v}</text>`;
  }
  // 折线面积
  let pts=scores.map((v,i)=>`${x(i)},${y(v)}`);
  const area=`${L},${y(0)} `+pts.join(' ')+` ${x(n-1)},${y(0)}`;
  g+=`<polygon points="${area}" fill="url(#grad)" opacity="0.18"/>`;
  g+=`<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B7BEC"/><stop offset="100%" stop-color="#2B7BEC" stop-opacity="0"/></linearGradient></defs>`;
  // 折线
  g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#2B7BEC" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  // 点 + 分数 + 次序
  scores.forEach((v,i)=>{
    g+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#fff" stroke="#2B7BEC" stroke-width="2.5"/>`;
    g+=`<text x="${x(i)}" y="${y(v)-11}" font-size="12" fill="#1B3A5C" font-weight="700" text-anchor="middle">${v}</text>`;
    g+=`<text x="${x(i)}" y="${H-20}" font-size="11" fill="#8a97a6" text-anchor="middle">第${i+1}次</text>`;
  });
  g+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${y(0)}" stroke="#c3cedb"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

// ── 保存图片 ──
el('saveBtn').addEventListener('click',async()=>{
  const btn=el('saveBtn');btn.disabled=true;btn.textContent='生成中…';
  try{
    const canvas=await html2canvas(el('captureArea'),{scale:2,backgroundColor:'#fff'});
    const a=document.createElement('a');
    const m=DATA.modules[cur];
    a.download=`成长曲线_${DATA.name}_${m.name}_${DATA.today}.png`;
    a.href=canvas.toDataURL('image/png');a.click();
  }catch(e){alert('保存失败，请直接截屏保存。');}
  btn.disabled=false;btn.textContent='📥 保存图片';
});

window.addEventListener('load',load);
</script>
</body></html>
